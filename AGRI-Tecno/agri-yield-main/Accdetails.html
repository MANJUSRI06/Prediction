<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account - Details</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script type="module" src="accdetail.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: url("accdetailsbg.JPG") no-repeat center center / cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        
        .form-container {
            padding: 32px;
            border-radius: 20px;
            width: 100%;
            max-width: 1100px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            background: rgba(240, 245, 240, 0.94);
        }
        
        .form-container h2 {
            text-align: center;
            margin-bottom: 28px;
            color: #2e7d32;
            font-size: 24px;
            font-weight: 700;
        }
        /* ✅ More fluid, responsive grid */
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px 24px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
        }
        
        .input-group label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 2px solid #ccc;
            font-size: 14px;
            outline: none;
            background: #fff;
        }
        
        .input-group input:focus,
        .input-group select:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 2px rgba(46, 125, 50, 0.15);
        }
        
        .error {
            color: red;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        
        .form-actions {
            text-align: center;
            margin-top: 28px;
        }
        
        button {
            padding: 12px 40px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(135deg, #43a047, #1b5e20);
            color: #fff;
            font-weight: bold;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }
        /* ✅ Popup message */
        
        #popupMessage {
            display: none;
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 15px;
            color: #fff;
            background: #28a745;
            z-index: 1000;
        }
        /* 🌍 Google Translate Box */
        
        #google_translate_element {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 2000;
            background: #ffeb3b;
            padding: 6px 12px;
            border-radius: 30px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            font-weight: bold;
            max-width: 60vw;
        }
        /* Hide Google branding frame */
        
        .goog-te-banner-frame.skiptranslate,
        .goog-te-gadget-icon {
            display: none !important;
        }
        
        body {
            top: 0 !important;
        }
        /* Translate Dropdown Styling */
        
        .goog-te-combo {
            padding: 6px 10px;
            border: 2px solid #064420;
            border-radius: 20px;
            font-size: 0.85rem;
            background: white;
            color: #064420;
            cursor: pointer;
            outline: none;
            transition: 0.3s;
            max-width: 100%;
        }
        
        .goog-te-combo:hover {
            border-color: #ff9800;
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.6);
        }
        /* 🔻 Tablet tweaks */
        
        @media (max-width: 1024px) {
            .form-container {
                padding: 24px;
            }
            .form-container h2 {
                font-size: 22px;
            }
        }
        /* 🔻 Mobile (<= 767px) */
        
        @media (max-width: 767px) {
            body {
                padding: 12px;
                align-items: flex-start;
            }
            .form-container {
                padding: 18px;
                border-radius: 14px;
                background: rgba(240, 245, 240, 0.96);
            }
            .form-container h2 {
                font-size: 20px;
                margin-bottom: 20px;
            }
            .form-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            button {
                width: 100%;
                padding: 12px;
                font-size: 15px;
            }
            #google_translate_element {
                top: 8px;
                right: 8px;
                padding: 4px 10px;
                font-size: 12px;
            }
        }
        /* 🔻 Extra small devices (<= 480px) */
        
        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            .form-container {
                padding: 14px;
                border-radius: 12px;
            }
            .form-container h2 {
                font-size: 18px;
            }
            #google_translate_element {
                top: 6px;
                right: 50%;
                transform: translateX(50%);
                max-width: 90vw;
                text-align: center;
            }
            #popupMessage {
                top: 48px;
                font-size: 14px;
                padding: 8px 16px;
            }
        }
    </style>
</head>

<body>
    <!-- 🌍 Google Translate Dropdown -->
    <div id="google_translate_element"></div>

    <div class="form-container">
        <h2>Create Account</h2>
        <form id="accountForm" novalidate>
            <div class="form-grid">
                <div class="input-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                    <span class="error">Full Name is required</span>
                </div>

                <div class="input-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number" required>
                    <span class="error">Enter a valid 10-digit mobile number</span>
                </div>

                <div class="input-group">
                    <label for="email">Email ID</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    <span class="error">Enter a valid email address</span>
                </div>

                <div class="input-group">
                    <label for="role">Role</label>
                    <select id="role" name="role" required>
                        <option value="">-- Select --</option>
                        <option value="farmer">Farmer</option>
                        <option value="buyer">Buyer</option>
                        <option value="general">General Public</option>
                    </select>
                    <span class="error">Please select a role</span>
                </div>

                <div class="input-group">
                    <label for="language">Preferred Language</label>
                    <select id="language" name="language" required>
                        <option value="">-- Select --</option>
                        <option value="tamil">Tamil</option>
                        <option value="english">English</option>
                        <option value="hindi">Hindi</option>
                    </select>
                    <span class="error">Please select a language</span>
                </div>

                <div class="input-group">
                    <label for="nation">Nation</label>
                    <input type="text" id="nation" name="nation" placeholder="Enter your nation" required>
                    <span class="error">Nation is required</span>
                </div>

                <div class="input-group">
                    <label for="state">State</label>
                    <input type="text" id="state" name="state" placeholder="Enter your state" required>
                    <span class="error">State is required</span>
                </div>

                <div class="input-group">
                    <label for="district">District</label>
                    <input type="text" id="district" name="district" placeholder="Enter your district" required>
                    <span class="error">District is required</span>
                </div>

                <div class="input-group">
                    <label for="pincode">Pincode</label>
                    <input type="text" id="pincode" name="pincode" placeholder="Enter your pincode" required>
                    <span class="error">Enter a valid 6-digit pincode</span>
                </div>

                <div class="input-group">
                    <label for="farmsize">Farm Size (in acres)</label>
                    <input type="number" id="farmsize" name="farmsize" placeholder="Enter farm size" required>
                    <span class="error">Enter a valid farm size</span>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit">Create Account</button>
            </div>
        </form>
    </div>

    <!-- ✅ Popup div -->
    <div id="popupMessage"></div>

    <!-- 🌍 Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'en,hi,ta,te,ml,kn,gu,mr,bn,pa,ur,fr,de,es,zh-CN,ja',
                layout: google.translate.TranslateElement.InlineLayout.HORIZONTAL
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>

</html>
