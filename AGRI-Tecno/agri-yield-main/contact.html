<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <style>
        /* Reset */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url("contactimage.jpg") center/cover no-repeat;
            z-index: -1;
        }
        /* Contact Form Container */
        
        .contact-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .contact-form {
            background: #fff;
            padding: 40px 30px;
            border-radius: 15px;
            width: 400px;
            max-width: 100%;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .contact-form h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 2px solid #2e7d32;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            transition: 0.3s;
            background-color: #fdfdfd;
        }
        
        .contact-form input:focus,
        .contact-form textarea:focus {
            outline: none;
            border-color: #1b5e20;
            box-shadow: 0 0 5px rgba(46, 125, 50, 0.5);
        }
        
        .contact-form button {
            width: 100%;
            padding: 14px;
            background: #2e7d32;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        
        .contact-form button:hover {
            background: #1b5e20;
        }
        
        .contact-form button:active {
            transform: scale(0.98);
        }
        /* ------------ RESPONSIVE STYLES ------------ */
        
            .contact-container {
                padding: 16px;
            }
        }
        
            .contact-container {
                padding: 16px 12px;
            }
            .contact-form {
                width: 100%;
                max-width: 420px;
                padding: 28px 20px;
            }
            .contact-form h2 {
                font-size: 1.4rem;
            }
            .contact-form input,
            .contact-form textarea {
                font-size: 13px;
                padding: 10px 12px;
            }
            .contact-form button {
                font-size: 15px;
                padding: 12px;
            }
        }
        
            .contact-container {
                padding: 14px 10px;
            }
            .contact-form {
                padding: 24px 16px;
                border-radius: 12px;
            }
        }
        
            .contact-form h2 {
                font-size: 1.25rem;
            }
            .contact-form input,
            .contact-form textarea {
                font-size: 12.5px;
            }
        }
    </style>
</head>

    <!-- Navigation Bar -->

        </ul>
    </nav>

    <!-- Contact Form -->
    <div class="contact-container">
        <div class="contact-form">
            <h2>Contact Us</h2>
            <form id="contactForm">
                <input type="text" id="name" placeholder="Your Name" required />
                <input type="email" id="email" placeholder="Email Address" required />
                <input type="tel" id="phone" placeholder="Phone Number" required />
                <input type="text" id="subject" placeholder="Subject" required />
                <textarea id="message" placeholder="Write your message..." rows="5" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>

    <!-- Shared Navbar Script -->
